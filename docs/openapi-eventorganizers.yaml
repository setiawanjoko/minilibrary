openapi: 3.0.0
info:
  title: Event Organizers API
  description: API documentation for managing location, promotors, promotor managers, events, and participants.
  version: 1.0.0

servers:
  - url: https://minilibrary-s8ph.onrender.com/api/v2
    description: Render demo website
  - url: http://localhost:3000/api/v2
    description: Local development server

tags:
  - name: Authentication
    description: Authentication and authorization
  - name: Locations
    description: Locations management
  - name: Promotors
    description: Promotors management
  - name: Promotor Managers
    description: Promotor managers management
  - name: Events
    description: Events management
  - name: Participants
    description: Participants management

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ErrorResponse:
      type: object
      properties:
        status:
          type: string
          example: "error"
        message:
            type: string
            example: "An error occurred"
        error:
          type: object
          additionalProperties: true
          example: 
            message: "Invalid input"
  # TODO: Add schemas for authentication, locations, promotors, promotor managers, events, and participants
  # For this API documentation, we will define the schemas for each of these entities.
  # 1. Authentication: RegisterRequest, RegisterResponse, LoginRequest, LoginResponse, RefreshTokenRequest, RefreshTokenResponse, LogoutResponse
  # 2. Locations: LocationResponse, AddLocationRequest, AddLocationResponse, EditLocationRequest, EditLocationResponse
  # 3. Promotors: PromotorResponse, AddPromotorRequest, AddPromotorResponse, EditPromotorRequest, EditPromotorResponse
  # 4. Promotor Managers: PromotorManagerResponse, AddPromotorManagerRequest, AddPromotorManagerResponse, EditPromotorManagerRequest, EditPromotorManagerResponse
  # 5. Events: EventResponse, AddEventRequest, AddEventResponse, EditEventRequest, EditEventResponse
  # 6. Participants: ParticipantResponse, AddParticipantRequest, AddParticipantResponse, EditParticipantRequest, EditParticipantResponse

  # This marks the beginning of authentication schema
    RegisterRequest:
      type: object
      required:
        - name
        - email
        - password
      properties:
        name:
          type: string
          example: John Doe
        email:
          type: string
          format: email
          example: john@example.com
        password:
          type: string
          example: secret123

    RegisterResponse:
      type: object
      properties:
        id:
          type: integer
          example: 1
        message:
          type: string
          example: "User registered successfully"

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: john@example.com
        password:
          type: string
          example: secret123

    LoginResponse:
      type: object
      properties:
        message:
          type: string
          example: "Login successful"
        accessToken:
          type: string
        refreshToken:
          type: string

    RefreshTokenRequest:
      type: object
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
    
    RefreshTokenResponse:

      type: object
      properties:
        message:
          type: string
          example: "Access token refreshed"
        accessToken:
          type: string
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
          
    LogoutResponse:
      type: object
      properties:
        message:
          type: string
          example: "Logout successful"
  # This marks the end of authentication schema

  # This marks the beginning of locations schema
    LocationRequest:
      type: object
      required:
        - name
        - address
        - city
        - state
        - country
        - zip_code
      properties:
        name:
          type: string
          example: "Central Park"
        address:
          type: string
          example: "5th Ave & E 59th St"
        city:
          type: string
          example: "New York"
        state:
          type: string
          example: "NY"
        zip_code:
          type: string
          example: "10022"
        country:
          type: string
          example: "USA"
        latitude:
          type: number
          format: float
          example: 50.0000
        longitude:
          type: number
          format: float
          example: 50.0000

    LocationResponse:
      type: object
      required:
        - status
        - message
        - data
      properties:
        status: 
          type: string
          example: "success"
        message:
          type: string
        data:
          type: object
          properties:
            id:
              type: integer
            name:
              type: string
              example: "Central Park"
            address:
              type: string
              example: "5th Ave & E 59th St"
            city:
              type: string
              example: "New York"
            state:
              type: string
              example: "NY"
            zip_code:
              type: string
              example: "10022"
            country:
              type: string
              example: "USA"
            latitude:
              type: number
              format: float
              example: 50.0000
            longitude:
              type: number
              format: float
              example: 50.0000

    Location:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
          example: "Central Park"
        address:
          type: string
          example: "5th Ave & E 59th St"
        city:
          type: string
          example: "New York"
        state:
          type: string
          example: "NY"
        zip_code:
          type: string
          example: "10022"
        country:
          type: string
          example: "USA"
        latitude:
          type: number
          format: float
          example: 50.0000
        longitude:
          type: number
          format: float
          example: 50.0000
  # This marks the end of locations schema
  
  # This marks the beginning of promotors schema
    Promotor:
      type: object
      properties:
        id:
          type: integer
          example: 1
        promotor_code:
          type: string
          example: "PROM001"
        slug:
          type: string
          example: "event-organizer-ltd"
        name:
          type: string
          example: "Event Organizer Ltd."
        description:
          type: string
          example: "Leading event organizer in the UK."
        contact_person:
          type: string
          example: "John Doe"
        contact_person_position:
          type: string
          example: "Manager"
        contact_person_phone:
          type: string
          example: "+441234567890"
        contact_person_email:
          type: string
          example: "john.doe@example.com"
        location_id:
          type: integer
          example: 1
        image_url:
          type: string
          format: uri
          example: "https://example.com/images/promotor.jpg"
        website_url:
          type: string
          format: uri
          example: "https://eventorganizer.com"
      
    PromotorRequest:
      type: object
      required:
      - name
      - location_id
      properties:
        name:
          type: string
          example: "Event Organizer Ltd."
        description:
          type: string
          example: "Leading event organizer in the UK."
        contact_person:
          type: string
          example: "John Doe"
        contact_person_position:
          type: string
          example: "Manager"
        contact_person_phone:
          type: string
          example: "+441234567890"
        contact_person_email:
          type: string
          example: "john.doe@example.com"
        location_id:
          type: integer
          example: 1
        image_url:
          type: string
          format: uri
          example: "https://example.com/images/promotor.jpg"
        website_url:
          type: string
          format: uri
          example: "https://eventorganizer.com"

    PromotorResponse:
      type: object
      properties:
        status:
          type: string
          example: "success"
        message: 
          type: string
        data:
          type: object
          properties:
            id:
              type: integer
              example: 1
            promotor_code:
              type: string
              example: "PR0001"
            slug:
              type: string
              example: "event-organizer-ltd"
            name:
              type: string
              example: "Event Organizer Ltd."
            description:
              type: string
              example: "Leading event organizer in the UK."
            contact_person:
              type: string
              example: "John Doe"
            contact_person_position:
              type: string
              example: "Manager"
            contact_person_phone:
              type: string
              example: "+441234567890"
            contact_person_email:
              type: string
              example: "john.doe@example.com"
            location_id:
              type: integer
              example: 1
            image_url:
              type: string
              format: uri
              example: "https://example.com/images/promotor.jpg"
            website_url:
              type: string
              format: uri
              example: "https://eventorganizer.com"
            
  # This marks the end of promotors schema
  # This marks the beginning of promotor managers schema
  # This marks the end of promotor managers schema
  # This marks the beginning of events schema
  # This marks the end of events schema
  # This marks the beginning of participants schema
  # This marks the end of participants schema
    PromotorManager:
      type: object
      properties:
        promotor_manager_id:
          type: integer
        promotor_id:
          type: integer
        promotor_name:
          type: string
        promotor_code:
          type: string
        promotor_slug:
          type: string
        manager_id:
          type: integer
        manager_name:
          type: string
        manager_email:
          type: string
        permission:
          type: array
          items:
            type: string
            enum: [read, write, delete]
        status:
          type: string
          enum: [active, inactive]

    AddPromotorManagerRequest:
      type: object
      required:
        - manager_id
      properties:
        manager_id:
          type: integer
        permission:
          type: array
          items:
            type: string
            enum: [read, write, delete]

    EditPromotorManagerRequest:
      type: object
      properties:
        permission:
          type: array
          items:
            type: string
            enum: [read, write, delete]
        status:
          type: string
          enum: [active, inactive]

    Event:
      type: object
      properties:
        id:
          type: integer
        event_code:
          type: string
          example: EVT12345
        slug:
          type: string
          example: event-slug
        name:
          type: string
          example: "Music Festival 2025"
        description:
          type: string
          example: "A grand music festival featuring top artists."
        location_id:
          type: integer
          example: 1
        start_time:
          type: string
          format: date-time
          example: "2025-05-01T18:00:00Z"
        end_time:
          type: string
          format: date-time
          example: "2025-05-01T23:00:00Z"
        promotor_id:
          type: integer
          example: 2
        status:
          type: string
          enum: [active, closed]
          example: active
        visibility:
          type: string
          enum: [public, private, unlisted]
          example: public
        tags:
          type: array
          items:
            type: string
          example: ["music", "festival"]
        image_url:
          type: string
          format: uri
          example: "https://example.com/event-image.jpg"
        timezone:
          type: string
          example: "UTC+7"
        currency:
          type: string
          example: "IDR"
        ticket_details:
          type: array
          items:
            type: object
            properties:
              ticket_type:
                type: string
                example: "VIP"
              price:
                type: number
                format: float
                example: 500000
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    EventRequest:
      type: object
      required:
        - name
        - location_id
        - start_time
      properties:
        name:
          type: string
          example: "Music Festival 2025"
        description:
          type: string
          example: "A grand music festival featuring top artists."
        location_id:
          type: integer
          example: 1
        start_time:
          type: string
          format: date-time
          example: "2025-05-01T18:00:00Z"
        end_time:
          type: string
          format: date-time
          example: "2025-05-01T23:00:00Z"
        visibility:
          type: string
          enum: [public, private, unlisted]
          example: public
        tags:
          type: array
          items:
            type: string
          example: ["music", "festival"]
        image_url:
          type: string
          format: uri
          example: "https://example.com/event-image.jpg"
        timezone:
          type: string
          example: "UTC+7"
        currency:
          type: string
          example: "IDR"
        ticket_details:
          type: array
          items:
            type: object
            properties:
              ticket_type:
                type: string
                example: "VIP"
              price:
                type: number
                format: float
                example: 500000

paths:
  /register:
    servers:
      - url: http://localhost:3000/
      - url: https://minilibrary-s8ph.onrender.com/
    post:
      tags: [Authentication]
      summary: Register user
      description: Register a new user without giving access token and refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: User registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterResponse"
        "400":
          description: Invalid user input
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "User registration failed"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Registration failed due to server error"

  /login:
    servers:
      - url: http://localhost:3000/
      - url: https://minilibrary-s8ph.onrender.com/
    post:
      tags: [Authentication]
      summary: Login user
      description: Login user and get access token and refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "500":
          description: Login failed due to server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Login failed due to server error"

  /refresh-token:
    servers:
      - url: http://localhost:3000/
      - url: https://minilibrary-s8ph.onrender.com/
    post:
      tags: [Authentication]
      summary: Refresh access token
      description: Refresh access token using refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenRequest"
      responses:
        "200":
          description: Access token berhasil diperbarui
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefreshTokenResponse"
        "400":
          description: Refresh token is required
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Refresh token is required"
        "401":
          description: Invalid or expired refresh token
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Invalid or expired refresh token"

  /logout:
    servers:
      - url: http://localhost:3000/
      - url: https://minilibrary-s8ph.onrender.com/
    post:
      tags: [Authentication]
      summary: Logout user
      description: Logout user and invalidate refresh token
      responses:
        "200":
          description: Logout successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogoutResponse"
        "400":
          description: Token is required for logout
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Token is required for logout"
        "500":
          description: Logout failed due to server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Logout failed due to server error"

  /locations:
    get:
      tags: [Locations]
      summary: Get all locations
      description: Retrieve a list of all locations.
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
            example: 10
          description: The number of records to retrieve.
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
            example: 0
          description: The number of records to skip.
      responses:
        "200":
          description: List of locations
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "success"
                  message:
                    type: string
                    example: "Successfully retrieved 1 location(s)."
                  data:
                    type: object
                    properties:
                      locations:
                        type: array
                        items:
                          $ref: "#/components/schemas/Location"
                      limit:
                        type: integer
                        example: 10
                      offset:
                        type: integer
                        example: 1
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      tags: [Locations]
      summary: Add a new location
      description: Create a new location.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocationRequest"
      responses:
        "201":
          description: Location successfully created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocationResponse"
              example:
                status: "success"
                message: "Location created successfully"
                data:
                  id: 1
                  name: "Central Park"
                  address: "5th Ave & E 59th St"
                  city: "New York"
                  state: "NY"
                  zip_code: "10022"
                  country: "USA"
                  latitude: 40.785091
                  longitude: -73.968285
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: "error"
                message: "Invalid input"
                error:
                  message: "Address are required"
        "404":
          description: Location not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: "error"
                message: "Location with ID 123 not found"

  /locations/{id}:
    get:
      tags: [Locations]
      summary: Get a location by ID
      description: Retrieve details of a specific location by its ID.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Location details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocationResponse"
        "404":
          description: Location not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      tags: [Locations]
      summary: Update a location by ID
      description: Update details of a specific location.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocationRequest"
      responses:
        "200":
          description: Location successfully updated
          content:
            application/json:
              schema:
                type: object
                $ref: "#/components/schemas/LocationResponse"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                type: object
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Location not found
          content:
            application/json:
              schema:
                type: object
                $ref: "#/components/schemas/ErrorResponse"

    delete:
      tags: [Locations]
      summary: Delete a location by ID
      description: Soft-deleting a location by ID.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Location successfully marked as inactive
          content:
            application/json:
              schema:
                type: object
                $ref: "#/components/schemas/LocationResponse"
        "404":
          description: Location not found
          content:
            application/json:
              schema:
                type: object
                $ref: "#/components/schemas/ErrorResponse"

  /promotors:
    get:
      tags: [Promotors]
      summary: Get all promotors
      description: Retrieve a list of all promotors.
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
            example: 10
          description: The number of records to retrieve.
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
            example: 0
          description: The number of records to skip.
      responses:
        "200":
          description: List of promotors
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "success"
                  message:
                    type: string
                    example: "Promotors retrieved successfully."
                  data:
                    type: object
                    properties:
                      promotors:
                        type: array
                        items:
                          $ref: "#/components/schemas/Promotor"
                      limit:
                        type: integer
                        example: 10
                      offset:
                        type: integer
                        example: 1
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      tags: [Promotors]
      summary: Add a new promotor
      description: Create a new promotor.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PromotorRequest"
      responses:
        "201":
          description: Promotor successfully created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromotorResponse"
                example:
                status: "success"
                message: "Promotor added successfully."
                data:
                  id: 1
                  promotor_code: "PROM001"
                  slug: "event-organizer-ltd"
                  name: "Event Organizer Ltd."
                  description: "Leading event organizer in the UK."
                  contact_person: "John Doe"
                  contact_person_position: "Manager"
                  contact_person_phone: "+441234567890"
                  contact_person_email: "john.doe@example.com"
                  location_id: 1
                  image_url: "https://example.com/images/promotor.jpg"
                  website_url: "https://eventorganizer.com"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: "error"
                message: "Invalid input"
                error:
                  message: "Address are required"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: error
                message: Internal server error

  /promotors/{id}:
    get:
      tags: [Promotors]
      summary: Get a promotor by ID
      description: Retrieve details of a specific promotor by its ID.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Promotor details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromotorResponse"
        "404":
          description: Promotor not found
          content:
            application/json:
              schema:
                type: object
                $ref: "#/components/schemas/ErrorResponse"
#TODO: above clear, below not yet
    put:
      tags: [Promotors]
      summary: Update a promotor by ID
      description: Update details of a specific promotor.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PromotorRequest"
      responses:
        "200":
          description: Promotor successfully updated
          content:
            application/json:
              schema:
                type: object
                $ref: "#/components/schemas/PromotorResponse"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                type: object
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Location not found
          content:
            application/json:
              schema:
                type: object
                $ref: "#/components/schemas/ErrorResponse"

    delete:
      tags: [Promotors]
      summary: Soft delete a promotor by ID
      description: Mark a promotor as deleted by setting the `deleted_at` timestamp.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Location successfully marked as deleted
          content:
            application/json:
              schema:
                type: object
