openapi: 3.0.0
info:
  title: Mini Library API
  version: 1.0.0
  description: A simple library API for managing user login, books, book borrowings, and returnings.

servers:
  - url: https://minilibrary-s8ph.onrender.com/api
    description: Render demo website
  - url: http://localhost:3000/api
    description: Local development

tags:
  - name: Authentication
    description: Registration, login, logout, and token management
  - name: Books
    description: Book management
  - name: Borrowings
    description: Book borrowings management

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ErrorResponse:
      type: object
      properties:
        status:
          type: string
          example: "error"
        message:
            type: string
            example: "An error occurred"
        error:
          type: object
          additionalProperties: true
          example: 
            message: "Invalid input"
    # For this API specification, there are three main groups of schemas:
    # 1. Authentication schemas: RegisterUser, LoginUser, AuthResponse, RefreshTokenRequest, RefreshTokenResponse, LogoutRequest, LogoutResponse
    # 2. Book schemas: Book, BookInput
    # 3. Borrowing schemas: Borrowing, BorrowRequest
    # 4. Returning schemas: ReturnBookRequest, ReturnBookResponse

    # This marks the start of Group 1: Authentication schemas
    RegisterRequest:
      type: object
      required:
        - name
        - email
        - password
      properties:
        name:
          type: string
          example: John Doe
        email:
          type: string
          format: email
          example: john@example.com
        password:
          type: string
          example: secret123

    RegisterResponse:
      type: object
      properties:
        id:
          type: integer
          example: 1
        message:
          type: string
          example: "User registered successfully"

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: john@example.com
        password:
          type: string
          example: secret123

    LoginResponse:
      type: object
      properties:
        message:
          type: string
          example: "Login successful"
        accessToken:
          type: string
        refreshToken:
          type: string

    RefreshTokenRequest:
      type: object
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
    
    RefreshTokenResponse:

      type: object
      properties:
        message:
          type: string
          example: "Access token refreshed"
        accessToken:
          type: string
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
          
    LogoutResponse:
      type: object
      properties:
        message:
          type: string
          example: "Logout successful"
    # This marks the end of Group 1: Authentication schemas

    # This marks the start of Group 2: Book schemas
    BookRequest:
      type: object
      required:
        - title
        - author
      properties:
        title:
          type: string
          example: "The Great Gatsby"
        author:
          type: string
          example: "F. Scott Fitzgerald"

    BookResponse:
      type: object
      properties:
        status:
          type: integer
        message:
          type: string
        data:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
                example: 1
              title:
                type: string
                example: "The Great Gatsby"
              author:
                type: string
                example: "F. Scott Fitzgerald"
              available:
                type: boolean
                example: true
    # This marks the end of Group 2: Book schemas

    # This marks the start of Group 3: Borrowing schemas
    Borrowing:
      type: object
      properties:
        id:
          type: integer
        book_id:
          type: integer
        user_id:
          type: integer
        borrowed_at:
          type: string
          format: date-time
        returned_at:
          type: string
          format: date-time
          nullable: true

    BorrowRequest:
      type: object
      required:
        - book_id
      properties:
        book_id:
          type: integer
          example: 2
    # This marks the end of Group 3: Borrowing schemas

paths:
  /register:
    servers:
      - url: http://localhost:3000/
      - url: https://minilibrary-s8ph.onrender.com/
    post:
      tags: [Authentication]
      summary: Register user
      description: Register a new user without giving access token and refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: User registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterResponse"
        "400":
          description: Invalid user input
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "User registration failed"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Registration failed due to server error"

  /login:
    servers:
      - url: http://localhost:3000/
      - url: https://minilibrary-s8ph.onrender.com/
    post:
      tags: [Authentication]
      summary: Login user
      description: Login user and get access token and refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "500":
          description: Login failed due to server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Login failed due to server error"

  /refresh-token:
    servers:
      - url: http://localhost:3000/
      - url: https://minilibrary-s8ph.onrender.com/
    post:
      tags: [Authentication]
      summary: Refresh access token
      description: Refresh access token using refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenRequest"
      responses:
        "200":
          description: Access token berhasil diperbarui
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefreshTokenResponse"
        "400":
          description: Refresh token is required
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Refresh token is required"
        "401":
          description: Invalid or expired refresh token
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Invalid or expired refresh token"

  /logout:
    servers:
      - url: http://localhost:3000/
      - url: https://minilibrary-s8ph.onrender.com/
    post:
      tags: [Authentication]
      summary: Logout user
      description: Logout user and invalidate refresh token
      responses:
        "200":
          description: Logout successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogoutResponse"
        "400":
          description: Token is required for logout
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Token is required for logout"
        "500":
          description: Logout failed due to server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Logout failed due to server error"

  /books:
    get:
      tags: [Books]
      summary: Retrieve all books
      description: Retrieve all books
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 10
      responses:
        "200":
          description: Books list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BookResponse"

    post:
      tags: [Books]
      summary: Add a new book
      description: Add a new book to the library. This endpoint only available for admin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookRequest"
      responses:
        "201":
          description: Book added successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                items:
                  $ref: "#/components/schemas/ErrorResponse"

  /books/{id}:
    get:
      tags: [Books]
      summary: Retrieve a book by ID
      description: Retrieve a book by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Book found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookResponse"
        "404":
          description: Book not found
          content:
            application/json:
              schema:
                type: object
                items:
                  $ref: "#/components/schemas/ErrorResponse"

    put:
      tags: [Books]
      summary: Update a book
      description: Update a book in the library. This endpoint only available for admin.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookRequest"
      responses:
        "200":
          description: Book updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookResponse"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                type: object
                items:
                  $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Book not found
          content:
            application/json:
              schema:
                type: object
                items:
                  $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                items:
                  $ref: "#/components/schemas/ErrorResponse"
    
    delete:
      tags: [Books]
      summary: Delete a book
      description: Delete a book from the library. This endpoint only available for admin.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Book deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "success"
                  message:
                    type: string
                    example: "Book deleted successfully"
        "404":
          description: Book not found
          content:
            application/json:
              schema:
                type: object
                items:
                  $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                items:
                  $ref: "#/components/schemas/ErrorResponse"

  /borrowings:
    get:
      tags: [Borrowings]
      summary: Retrieve all borrowings
      description: Retrieve all borrowings. This endpoint only available for admin.
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 10
      responses:
        "200":
          description: Borrowings retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Borrowing"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                items:
                  $ref: "#/components/schemas/ErrorResponse"

    post:
      tags: [Borrowings]
      summary: Borrow a book
      description: Borrow a book from the library. This endpoint only available for admin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BorrowRequest"
      responses:
        "201":
          description: Book borrowed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Borrowing"
        "400":
          description: Book is currently borrowed
          content:
            application/json:
              schema:
                type: object
                items:
                  $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Book not found
          content:
            application/json:
              schema:
                type: object
                items:
                  $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                items:
                  $ref: "#/components/schemas/ErrorResponse"

  /borrowings/{id}:
    get:
      tags: [Borrowings]
      summary: Retrieve a borrowing by ID
      description: Retrieve a borrowing by ID. This endpoint only available for admin.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Borrowing found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Borrowing"
        "404":
          description: Book borrowing information not found
          content:
            application/json:
              schema:
                type: object
                items:
                  $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Failed to retrieve book borrowing
          content:
            application/json:
              schema:
                type: object
                items:
                  $ref: "#/components/schemas/ErrorResponse"
    put:
      tags: [Borrowings]
      summary: Update a borrowing
      description: Update a borrowing in the library. Use this endpoint to mark book borrowing as returned. This endpoint only available for admin.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Book borrowing updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Borrowing"
        "400":
          description: Book has already been returned
          content:
            application/json:
              schema:
                type: object
                items:
                  $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Borrowing record not found
          content:
            application/json:
              schema:
                type: object
                items:
                  $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                items:
                  $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags: [Borrowings]
      summary: Delete a borrowing
      description: Delete a borrowing from the library. Only a non-returned book borrowing can be deleted. You should not use this endpoint to mark borrowing as returned. This endpoint only available for admin.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Borrowing record has been forcefully deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "success"
                  message:
                    type: string
                    example: "Borrowing record has been forcefully deleted"
        "404":
          description: Borrowing record not found
          content:
            application/json:
              schema:
                type: object
                items:
                  $ref: "#/components/schemas/ErrorResponse"
        "400":
          description: Cannot delete a returned borrowing record
          content:
            application/json:
              schema:
                type: object
                items:
                  $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                items:
                  $ref: "#/components/schemas/ErrorResponse"